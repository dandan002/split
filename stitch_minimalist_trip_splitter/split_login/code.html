<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        body {
            background-color: #ffffff;
            color: #000000;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            border-bottom-color: #000000 !important;
        }
        .login-canvas {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest antialiased overflow-hidden">
<!-- TopAppBar Suppressed as per "The Destination Rule" for Transactional Screens -->
<main class="login-canvas px-margin-mobile max-w-md mx-auto">
<!-- Branding Anchor -->
<header class="mb-xl">
<h1 class="font-display text-display text-primary uppercase tracking-tighter">
                Split
            </h1>
<p class="font-body-md text-body-md text-secondary mt-xs">
                Architectural debt management.
            </p>
</header>
<!-- Login Form Section -->
<section class="space-y-lg">
<div class="relative group">
<label class="font-label-caps text-label-caps text-secondary block mb-xs" for="email">EMAIL ADDRESS</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-sm font-body-lg text-body-lg placeholder:text-outline focus:ring-0 transition-colors" id="email" placeholder="name@example.com" type="email"/>
</div>
<div class="relative group">
<div class="flex justify-between items-end mb-xs">
<label class="font-label-caps text-label-caps text-secondary" for="password">PASSWORD</label>
<a class="font-label-caps text-label-caps text-primary hover:underline" href="#">FORGOT?</a>
</div>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant py-sm font-body-lg text-body-lg placeholder:text-outline focus:ring-0 transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps py-md h-14 flex items-center justify-center tracking-widest hover:opacity-90 transition-opacity active:scale-[0.98] transform">
                GET STARTED
            </button>
</section>
<!-- Divider Block -->
<div class="py-xl flex items-center gap-md">
<div class="h-[1px] bg-outline-variant flex-grow"></div>
<span class="font-label-caps text-label-caps text-outline">OR</span>
<div class="h-[1px] bg-outline-variant flex-grow"></div>
</div>
<!-- Social Actions -->
<footer class="flex flex-col items-center space-y-md">
<a class="font-label-caps text-label-caps text-primary border-b border-transparent hover:border-primary transition-all" href="#">
                CONTINUE WITH APPLE
            </a>
<a class="font-label-caps text-label-caps text-primary border-b border-transparent hover:border-primary transition-all" href="#">
                CONTINUE WITH GOOGLE
            </a>
</footer>
<p class="mt-xl text-center font-body-md text-body-md text-secondary">
            Don't have an account? <a class="text-primary font-bold border-b border-primary" href="#">Create Account</a>
</p>
</main>
<!-- Background Atmospheric Layer (Optional for subtle polish) -->
<div class="fixed inset-0 -z-10 opacity-[0.02] pointer-events-none">
<div class="absolute top-0 left-0 w-full h-full" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 40px 40px;"></div>
</div>
<!-- Script for micro-interactions -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.previousElementSibling?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.previousElementSibling?.classList.remove('text-primary');
            });
        });
    </script>
</body></html>
